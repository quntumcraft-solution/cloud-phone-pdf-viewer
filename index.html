<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantumPay Test</title>
</head>
<body>
<h3>QuantumPay 4G</h3>

<button onclick="testTel()">TEST TEL</button>
<button onclick="testSMS()">TEST SMS</button>

<div id="result"></div>

<script>
async function testTel() {
 try {
  let r = await navigator.hasFeature("TelScheme");
  document.getElementById("result").innerHTML =
   "TEL SCHEME: " + r;
 } catch(e) {
  document.getElementById("result").innerHTML =
   "TEL ERROR: " + e;
 }
}

async function testSMS() {
 try {
  let r = await navigator.hasFeature("SmsScheme");
  document.getElementById("result").innerHTML =
   "SMS SCHEME: " + r;
 } catch(e) {
  document.getElementById("result").innerHTML =
   "SMS ERROR: " + e;
 }
}
</script>
</body>
</html>
