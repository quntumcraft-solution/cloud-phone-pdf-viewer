<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#071b2b">
<title>QuantumPay 4G</title>

<style>
:root {
    --bg: #071b2b;
    --panel: #102c40;
    --panel2: #163b52;
    --text: #f2f8fc;
    --muted: #a9c0cf;
    --accent: #45d6b2;
    --warn: #ffd166;
    --danger: #ff8b8b;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 12px Arial, sans-serif;
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
    max-width: 360px;
    margin: auto;
    display: flex;
    flex-direction: column;
}

header {
    height: 22px;
    flex: 0 0 22px;
    background: #04131f;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 7px;
    font-weight: bold;
    font-size: 10px;
}

#screen {
    flex: 1;
    overflow: auto;
    padding: 6px;
}

footer {
    height: 17px;
    flex: 0 0 17px;
    background: #04131f;
    color: var(--muted);
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-size: 8px;
}

h1 {
    font-size: 15px;
    margin: 2px 0 7px;
    color: var(--accent);
}

.card {
    background: var(--panel);
    border: 1px solid #24465a;
    border-radius: 6px;
    padding: 7px;
    margin: 5px 0;
    line-height: 1.4;
}

.muted {
    color: var(--muted);
    font-size: 10px;
    line-height: 1.4;
}

.warn {
    color: var(--warn);
}

.danger {
    color: var(--danger);
}

.menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    margin-top: 7px;
}

button {
    font: bold 11px Arial;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid #386078;
    border-radius: 5px;
    padding: 8px 5px;
    min-height: 31px;
    width: 100%;
    text-align: left;
}

button.primary {
    background: #087d6c;
    border-color: var(--accent);
}

button.selected,
button:focus {
    outline: 2px solid var(--warn);
    background: #28536a;
}

.full {
    grid-column: 1 / -1;
}

.label {
    display: block;
    color: var(--muted);
    font-size: 10px;
    margin: 6px 0 3px;
}

input {
    width: 100%;
    height: 29px;
    border: 1px solid #52748a;
    border-radius: 4px;
    background: #f5fbff;
    color: #071b2b;
    padding: 5px;
    font-size: 13px;
}

video {
    width: 100%;
    max-height: 105px;
    background: #000;
}

.smallbtn {
    width: auto;
    min-height: 25px;
    padding: 5px 8px;
    margin: 3px 2px;
    font-size: 10px;
}
</style>
</head>

<body>

<div id="app">

<header>
    <span>QUANTUMPAY 4G</span>
    <span id="clock">--:--</span>
</header>

<main id="screen"></main>

<footer>
    <span>↑↓ Select</span>
    <span>OK Open</span>
    <span>Back</span>
</footer>

</div>

<script>

(function() {

"use strict";

const root = document.getElementById("screen");

const STORE = "quantumpay4g_v2";

let page = "home";
let sel = 0;
let stream = null;

let form = {
    name: "",
    vpa: "",
    amount: "",
    note: ""
};

function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    }[c]));
}

function records() {
    try {
        return JSON.parse(localStorage.getItem(STORE) || "[]");
    } catch(e) {
        return [];
    }
}

function save(data) {
    try {
        localStorage.setItem(
            STORE,
            JSON.stringify(data.slice(0, 40))
        );
    } catch(e) {
        alert("Local storage unavailable");
    }
}

function stopCamera() {
    if(stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
}

function go(p) {
    stopCamera();
    page = p;
    sel = 0;
    render();
}

function btn(label, action, cls = "") {
    return `
    <button class="${cls}"
    data-action="${action}">
    ${label}
    </button>`;
}

function field(label, id, type, placeholder, value) {
    return `
    <label class="label" for="${id}">
    ${label}
    </label>

    <input
    id="${id}"
    type="${type}"
    placeholder="${placeholder}"
    value="${esc(value)}"
    autocomplete="off">
    `;
}

function render() {

    let out = "";

    if(page === "home") {

        out = `
        <h1>Welcome</h1>

        <div class="card">
        <b>QuantumPay Assistant</b>
        <div class="muted">
        Simple payment assistant for keypad phones.
        </div>
        </div>

        <div class="menu">

        ${btn("1. Pay using UPI", "pay", "primary")}

        ${btn("2. Scan UPI QR", "scan")}

        ${btn("3. USSD *99#", "ussd")}

        ${btn("4. UPI 123PAY", "guide")}

        ${btn("5. Transaction History", "history")}

        ${btn("6. Help & Safety", "help")}

        </div>
        `;

    }

    else if(page === "pay") {

        out = `
        <h1>Pay with UPI</h1>

        <div class="card muted">
        Enter recipient's verified UPI ID.
        </div>

        ${field(
            "Recipient Name",
            "pname",
            "text",
            "Name",
            form.name
        )}

        ${field(
            "UPI ID",
            "vpa",
            "text",
            "example@bank",
            form.vpa
        )}

        ${field(
            "Amount (INR)",
            "amount",
            "number",
            "100",
            form.amount
        )}

        ${field(
            "Payment Note",
            "note",
            "text",
            "Payment",
            form.note
        )}

        ${btn(
            "Continue to UPI",
            "makeupi",
            "primary"
        )}

        ${btn("Back", "home")}
        `;

    }

    else if(page === "confirm") {

        out = `
        <h1>Confirm Details</h1>

        <div class="card">

        Name: ${esc(form.name || "Not provided")}<br>

        UPI ID: ${esc(form.vpa)}<br>

        Amount: ₹${esc(form.amount)}<br>

        Note: ${esc(form.note || "-")}

        </div>

        <div class="card warn">
        Verify the recipient and amount in your
        official UPI app.

        Never enter your UPI PIN here.
        </div>

        ${btn(
            "Open UPI Application",
            "launchupi",
            "primary"
        )}

        ${btn("Edit Details", "pay")}

        `;

    }

    else if(page === "ussd") {

        out = `
        <h1>USSD Banking</h1>

        <div class="card">
        Try opening your phone dialler with:

        <b>*99#</b>
        </div>

        <div class="card danger">
        USSD availability depends on SIM,
        operator and Cloud Phone support.
        </div>

        ${btn(
            "Open Dialler *99#",
            "dialussd",
            "primary"
        )}

        ${btn("Back", "home")}
        `;

    }

    else if(page === "guide") {

        out = `
        <h1>UPI 123PAY</h1>

        <div class="card">

        UPI 123PAY is a voice-based payment
        service for supported banks and users.

        </div>

        <div class="card">

        1. Check bank support.<br>
        2. Use the official number published
        by your bank or NPCI.<br>
        3. Follow voice instructions.<br>
        4. Verify transaction details.

        </div>

        <div class="card warn">

        This widget cannot independently
        perform or confirm 123PAY transactions.

        </div>

        ${btn("Back", "home")}

        `;

    }

    else if(page === "scan") {

        out = `
        <h1>QR Scanner</h1>

        <div class="card muted">

        Camera permission and browser QR
        detection support are required.

        </div>

        <video id="video" playsinline muted></video>

        <div id="scanmsg" class="muted">
        Press Start Camera.
        </div>

        ${btn(
            "Start Camera",
            "startscan",
            "primary"
        )}

        ${btn("Stop Camera", "stopscan")}

        ${btn("Back", "home")}

        `;

    }

    else if(page === "qrresult") {

        out = `
        <h1>QR Details</h1>

        <div class="card">
        ${esc(window.qpQR || "No QR data")}
        </div>

        <div class="card warn">

        Verify QR details before payment.

        </div>

        ${btn(
            "Use QR Details",
            "useqr",
            "primary"
        )}

        ${btn("Back", "scan")}

        `;

    }

    else if(page === "history") {

        const data = records();

        out = `
        <h1>Transaction History</h1>

        <div class="muted">
        These are local payment attempts,
        not bank-confirmed transactions.
        </div>
        `;

        if(data.length === 0) {

            out += `
            <div class="card">
            No records found.
            </div>
            `;

        }

        data.forEach(x => {

            out += `
            <div class="card">

            <b>₹${esc(x.amount)}</b><br>

            ${esc(x.vpa)}<br>

            <span class="muted">
            ${esc(x.date)}
            </span>

            <br>

            <span class="muted">
            ${esc(x.state)}
            </span>

            </div>
            `;

        });

        out += btn(
            "Clear History",
            "clear"
        );

        out += btn(
            "Back",
            "home"
        );

    }

    else if(page === "help") {

        out = `
        <h1>Help & Safety</h1>

        <div class="card">

        QuantumPay is an independent
        payment assistant.

        It is not a bank or UPI provider.

        </div>

        <div class="card">

        • UPI payment requires an official UPI app.<br>

        • USSD requires network support.<br>

        • QR scanning requires camera support.<br>

        • Browsers cannot freely read incoming SMS.

        </div>

        <div class="card danger">

        Never share your PIN, OTP or
        banking password.

        </div>

        ${btn("Back", "home")}

        `;

    }

    root.innerHTML = out;

    const controls = [
        ...root.querySelectorAll("button")
    ];

    controls.forEach((b, i) => {

        b.classList.toggle(
            "selected",
            i === sel
        );

    });

    ["pname", "vpa", "amount", "note"].forEach(id => {

        const el = document.getElementById(id);

        if(el) {

            el.addEventListener("input", () => {

                form[
                    id === "pname" ? "name" : id
                ] = el.value;

            });

        }

    });

}

function validForm() {

    form.name =
        (document.getElementById("pname")?.value || "").trim();

    form.vpa =
        (document.getElementById("vpa")?.value || "").trim();

    form.amount =
        (document.getElementById("amount")?.value || "").trim();

    form.note =
        (document.getElementById("note")?.value || "").trim();

    if(!/^[A-Za-z0-9._-]{2,256}@[A-Za-z0-9.-]{2,64}$/.test(form.vpa)) {

        alert("Enter a valid UPI ID.");
        return false;

    }

    if(
        !/^(?:\d{1,7})(?:\.\d{1,2})?$/.test(form.amount) ||
        Number(form.amount) <= 0
    ) {

        alert("Enter valid amount.");
        return false;

    }

    return true;

}

function launchUPI() {

    const params = new URLSearchParams({

        pa: form.vpa,

        pn: form.name || "Payee",

        am: form.amount,

        cu: "INR",

        tn: form.note || "Payment"

    });

    const uri = "upi://pay?" + params.toString();

    try {

        const a = document.createElement("a");

        a.href = uri;

        a.style.display = "none";

        document.body.appendChild(a);

        a.click();

        a.remove();

    }

    catch(e) {

        location.href = uri;

    }

    const data = records();

    data.unshift({

        vpa: form.vpa,

        amount: form.amount,

        date: new Date().toLocaleString(),

        state: "UPI app opened / status unverified"

    });

    save(data);

}

async function startCamera() {

    const msg = document.getElementById("scanmsg");

    const video = document.getElementById("video");

    if(!navigator.mediaDevices?.getUserMedia) {

        msg.textContent = "Camera API unavailable.";
        return;

    }

    if(!("BarcodeDetector" in window)) {

        msg.textContent =
            "QR detection unsupported. Use UPI app scanner.";

        return;

    }

    try {

        const detector = new BarcodeDetector({

            formats: ["qr_code"]

        });

        stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "environment"
            },

            audio: false

        });

        video.srcObject = stream;

        await video.play();

        msg.textContent = "Point camera at QR code.";

        const scan = async () => {

            if(!stream || page !== "scan") return;

            try {

                const codes = await detector.detect(video);

                if(codes.length) {

                    window.qpQR = codes[0].rawValue;

                    stopCamera();

                    go("qrresult");

                    return;

                }

            }

            catch(e) {}

            requestAnimationFrame(scan);

        };

        requestAnimationFrame(scan);

    }

    catch(e) {

        msg.textContent =
            "Camera permission denied or unavailable.";

    }

}

function activate(action) {

    if(action === "home") return go("home");

    if(action === "pay") return go("pay");

    if(action === "ussd") return go("ussd");

    if(action === "guide") return go("guide");

    if(action === "history") return go("history");

    if(action === "help") return go("help");

    if(action === "scan") return go("scan");

    if(action === "makeupi") {

        if(validForm()) go("confirm");

        return;

    }

    if(action === "launchupi") {

        launchUPI();

        alert(
            "UPI app launch requested. Verify payment in official app."
        );

        return;

    }

    if(action === "dialussd") {

        if(confirm("Open dialler for *99#?")) {

            location.href = "tel:*99%23";

        }

        return;

    }

    if(action === "startscan") {

        return startCamera();

    }

    if(action === "stopscan") {

        stopCamera();

        const msg = document.getElementById("scanmsg");

        if(msg) msg.textContent = "Camera stopped.";

        return;

    }

    if(action === "useqr") {

        const raw = window.qpQR || "";

        if(!/^upi:\/\/pay\?/i.test(raw)) {

            alert("This is not a standard UPI payment QR.");

            return;

        }

        try {

            const u = new URL(raw);

            form.vpa = u.searchParams.get("pa") || "";

            form.name = u.searchParams.get("pn") || "";

            form.amount = u.searchParams.get("am") || "";

            form.note = u.searchParams.get("tn") || "";

            go("pay");

        }

        catch(e) {

            alert("Unable to read QR details.");

        }

        return;

    }

    if(action === "clear") {

        if(confirm("Delete all local records?")) {

            save([]);

            render();

        }

        return;

    }

}

root.addEventListener("click", e => {

    const b = e.target.closest("[data-action]");

    if(b) activate(b.dataset.action);

});

function move(direction) {

    const buttons = [
        ...root.querySelectorAll("button")
    ];

    if(!buttons.length) return;

    sel = (sel + direction + buttons.length)
        % buttons.length;

    buttons.forEach((b, i) => {

        b.classList.toggle(
            "selected",
            i === sel
        );

    });

    buttons[sel].scrollIntoView({
        block: "nearest"
    });

}

document.addEventListener("keydown", e => {

    const tag = (
        e.target?.tagName || ""
    ).toLowerCase();

    if(tag === "input") {

        if(e.key === "Escape") {

            e.preventDefault();

            go("home");

        }

        return;

    }

    if([
        "ArrowDown",
        "ArrowRight",
        "2",
        "8",
        "6"
    ].includes(e.key)) {

        e.preventDefault();

        move(1);

    }

    else if([
        "ArrowUp",
        "ArrowLeft",
        "4",
        "5"
    ].includes(e.key)) {

        e.preventDefault();

        move(-1);

    }

    else if(
        e.key === "Enter" ||
        e.key === " "
    ) {

        e.preventDefault();

        const b = root.querySelectorAll("button")[sel];

        if(b) activate(b.dataset.action);

    }

    else if(
        e.key === "Escape" ||
        e.key === "Backspace"
    ) {

        e.preventDefault();

        go("home");

    }

});

function tick() {

    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

}

tick();

setInterval(tick, 30000);

render();

})();

</script>

</body>
 </html>
