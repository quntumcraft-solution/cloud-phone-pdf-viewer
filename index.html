<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantumPay Test</title>
<style>
body {
  background: #101827;
  color: white;
  text-align: center;
  font-family: Arial;
  padding: 20px;
}
button {
  display: block;
  width: 100%;
  padding: 18px;
  margin: 15px 0;
  font-size: 18px;
  background: #087fce;
  color: white;
  border: 0;
}
</style>

<body>

<h2>QuantumPay 4G</h2>
<p>System App Integration Test</p>

<button onclick="openUSSD()">Test USSD Banking</button>

<button onclick="showInfo()">Check JavaScript</button>

<p id="result">Ready</p>

<script>
function openUSSD() {
  document.getElementById("result").innerText =
  "Trying to open USSD...";
  window.location.href = "tel:*99%23";
}

function showInfo() {
  document.getElementById("result").innerText =
  "JavaScript Working Successfully!";
}
</script>

</body>
