<pre id="out" style="font-size:18px;white-space:pre-wrap;"></pre>

<script>
let e = window.external;
let p = e;

let result = "";

while (p) {
  Object.getOwnPropertyNames(p).forEach(k => {
    try {
      result += k + " : " + typeof e[k] + "\n";
    } catch(err) {}
  });
  p = Object.getPrototypeOf(p);
}

document.getElementById("out").textContent = result;
</script>
