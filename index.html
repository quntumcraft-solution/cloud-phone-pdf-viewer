<!DOCTYPE html>
<html>
<body style="background:#fff;color:#000;font-size:20px;padding:15px;">

<h3>Gupshup Pay Test</h3>

<button onclick="test()" style="font-size:20px;padding:15px;">
OPEN GUPSHUP PAY
</button>

<div id="result" style="font-size:20px;margin-top:20px;word-wrap:break-word;"></div>

<script>
function test() {
  let r = document.getElementById("result");

  try {
    let x = window.external.openURL("gupshup://");
    r.innerHTML = "Result: " + String(x);
  } catch(e) {
    r.innerHTML =
      "ERROR:<br>" + e.name +
      "<br>" + e.message;
  }
}
</script>

</body>
</html>
