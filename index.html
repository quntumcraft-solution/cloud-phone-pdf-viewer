<!DOCTYPE html>
<html>
<body>
<h3>QuantumPay Launch Test</h3>
<pre id="result"></pre>

<script>
let output = "";

output += "LaunchQueue: " +
(typeof window.launchQueue) + "\n";

output += "Android Interface: " +
(typeof window.Android) + "\n";

output += "WebView: " +
(typeof window.AndroidInterface) + "\n";

output += "External: " +
(typeof window.external) + "\n";

output += "App Bridge: " +
(typeof window.appBridge) + "\n";

output += "Native: " +
(typeof window.native) + "\n";

document.getElementById("result").textContent = output;
</script>
</body>
</html>
